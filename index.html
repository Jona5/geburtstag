<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Detektiv-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1 id="game-title">🕵️ Akte des Falls</h1>
    <p class="subtitle" id="game-subtitle">Gib den Code ein, den du gefunden hast.</p>

    <section id="entry" class="card">
      <input type="text" id="code-input" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Code eingeben..." aria-label="Code">
      <div class="btn-row">
        <button id="check-btn" class="btn">Prüfen</button>
      </div>
      <p id="error" class="error-msg" hidden>❌ Dieser Code ist unbekannt. Versuch's nochmal.</p>
    </section>

    <section id="result" class="card" hidden>
      <h2 id="result-title" class="result-title" hidden></h2>
      <img id="result-image" class="result-image" hidden>
      <p id="result-text" class="result-text"></p>
      <audio id="result-audio" hidden></audio>

      <div id="result-finale" hidden>
        <hr class="finale-divider">
        <h2 id="end-title" class="result-title"></h2>
        <img id="end-image" class="result-image" hidden>
        <p id="end-text" class="result-text"></p>
      </div>

      <div class="btn-row">
        <button id="replay-voice-btn" class="btn btn-secondary" type="button" hidden>🎙️ Nachricht wiederholen</button>
        <button id="reset-btn" class="btn btn-secondary">Neuen Code eingeben</button>
      </div>
    </section>
  </main>

  <footer>
    <a href="config.html" class="config-link" title="Konfiguration">⚙</a>
  </footer>

  <script src="storage.js"></script>
  <script src="theme.js"></script>
  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
