<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#3f3f6b"/>
    </pattern>
    <radialGradient id="spotlight" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1c1c3a"/>
      <stop offset="100%" stop-color="#0a0a16"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#spotlight)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
</svg>
