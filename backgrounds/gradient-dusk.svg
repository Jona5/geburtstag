<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="duskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="duskBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#duskGrad)"/>
  <circle cx="650" cy="120" r="120" fill="#f472b6" opacity="0.3" filter="url(#duskBlur)"/>
  <circle cx="120" cy="420" r="100" fill="#818cf8" opacity="0.25" filter="url(#duskBlur)"/>
</svg>
